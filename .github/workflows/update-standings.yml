name: Update volleyball standings
on:
  schedule:
    - cron: '15 */2 * * *' # every 2 hours (UTC); GitHub may delay scheduled jobs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Fetch and validate official rankings
        run: python scripts/update_standings.py
      - name: Commit updates if any
        run: |
          if git diff --quiet -- standings.json; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standings.json
          git commit -m 'chore: update volleyball standings'
          git push
